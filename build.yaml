name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web folder
        run: |
          mkdir -p www/adhan adhan
          cp index.html www/
          cp -n *.mp3 adhan/ 2>/dev/null || true
          cp adhan/*.mp3 www/adhan/

      - name: Install Capacitor and plugins
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Copy adhan sounds for notifications
        run: |
          RAW=android/app/src/main/res/raw
          mkdir -p $RAW
          cp adhan/makkah-1.mp3 $RAW/adhan_makkah1.mp3
          cp adhan/makkah-2.mp3 $RAW/adhan_makkah2.mp3
          cp adhan/cairo-refaat.mp3 $RAW/adhan_refaat.mp3
          cp adhan/cairo-albanna.mp3 $RAW/adhan_albanna.mp3
          cp adhan/mnshawi.mp3 $RAW/adhan_mnshawi.mp3

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
